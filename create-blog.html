<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Blog | BlogSpace</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="navbar"><a class="brand" href="index.html">BlogSpace</a><nav><a href="index.html">Home</a><a href="dashboard.html">Dashboard</a></nav></header>
<main class="form-wrap wide"><form id="blogForm" class="form-card"><p class="eyebrow">PUBLISH AN IDEA</p><h1>Create a blog</h1><label>Blog title<input id="blogTitle" type="text" maxlength="90" placeholder="Enter an interesting title" required></label>
<label>Category<input id="blogCategory" type="text" placeholder="Technology, Education, Travel..." required></label>
<label>Blog content<textarea id="blogContent" rows="9" placeholder="Write your story here..." required></textarea></label>
<div class="button-row"><a class="btn secondary" href="dashboard.html">Cancel</a><button class="btn" type="submit">Publish blog</button></div><p id="blogMessage" class="message"></p></form></main><script src="js/script.js"></script></body></html>
