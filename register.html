<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | BlogSpace</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="navbar"><a class="brand" href="index.html">BlogSpace</a><nav><a href="index.html">Home</a><a href="login.html">Login</a><a class="active" href="register.html">Register</a></nav></header>
<main class="form-wrap"><form id="registerForm" class="form-card"><p class="eyebrow">JOIN BLOGSPACE</p><h1>Create account</h1><p class="muted">Start sharing your ideas today.</p>
<label>Full name<input id="regName" type="text" placeholder="Your name" required></label>
<label>Email address<input id="regEmail" type="email" placeholder="you@example.com" required></label>
<label>Password<input id="regPassword" type="password" minlength="6" placeholder="At least 6 characters" required></label>
<button class="btn full" type="submit">Create account</button><p class="form-note">Already registered? <a href="login.html">Login</a></p><p id="registerMessage" class="message"></p>
</form></main><script src="js/script.js"></script></body></html>
